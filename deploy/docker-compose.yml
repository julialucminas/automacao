name: faturas

services:
  # Porta de entrada: HTTPS automático (Let's Encrypt), entrega da interface e encaminha /api.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # monta a PASTA (não o arquivo): o git troca o arquivo por um novo, e a montagem de arquivo
      # continuaria apontando para o antigo
      - ./caddy:/etc/caddy:ro
      # monta a pasta web inteira (e não só dist) para a troca de versão não "perder" o diretório
      - ../web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # API + banco de dados (SQLite). O banco fica FORA da pasta do código: /opt/faturas-dados
  api:
    build: ../api
    restart: unless-stopped
    volumes:
      - /opt/faturas-dados:/dados
    # sem "ports": a API só é acessível pelo Caddy, nunca direto da internet

volumes:
  caddy_data:
  caddy_config:
